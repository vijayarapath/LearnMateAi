{% extends "myapp/auth/shell.html" %}
{% block title %}Change password{% endblock %}
{% block auth_body %}
<h1>Change password</h1><p class="text-muted">Choose a new password of at least 8 characters.</p>
<form method="post" novalidate>{% csrf_token %}
  {% include "myapp/partials/form_fields.html" with form=form %}
  <button class="btn btn-primary w-100">Save password</button>
</form>
<p class="small mt-3"><a href="{% url 'home' %}">Back</a></p>
{% endblock %}
