{% extends "myapp/auth/shell.html" %}
{% block title %}Reset your password{% endblock %}
{% block auth_body %}
<h1>Reset your password</h1><p class="text-muted">Enter your email and we will send a reset link.</p>
<form method="post" novalidate>{% csrf_token %}
  {% include "myapp/partials/form_fields.html" with form=form %}
  <button class="btn btn-primary w-100">Send reset link</button>
</form>
<p class="small mt-3"><a href="{% url 'home' %}">Back</a></p>
{% endblock %}
